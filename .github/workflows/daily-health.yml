name: Daily health check

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    if: ${{ vars.HEALTHCHECK_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check app and database health
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: |
          test -n "$HEALTHCHECK_URL"
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 30 "$HEALTHCHECK_URL"
